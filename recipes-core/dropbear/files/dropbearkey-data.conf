# The host key lives on /data (see dropbear.default): wait for /data and
# generate the key only if it is not there yet. The empty line resets
# poky's conditions for /etc/dropbear and /var/lib/dropbear.
[Unit]
RequiresMountsFor=/data
ConditionPathExists=
ConditionPathExists=!/data/dropbear/dropbear_rsa_host_key
