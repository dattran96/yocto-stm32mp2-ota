# RAUC system configuration for the STM32MP257F-DK (SD card boot)
[system]
# Must match RAUC_BUNDLE_COMPATIBLE of the bundle recipe;
# RAUC refuses bundles built for another product.
compatible=stm32mp257f-dk-mydistro
# Talk to U-Boot via fw_setenv/fw_printenv (BOOT_ORDER, BOOT_x_LEFT)
bootloader=uboot
# Accept only verity bundles (checked by dm-verity while installing)
bundle-formats=-plain

[keyring]
path=/etc/rauc/ca.cert.pem

# Slots by controller path: /dev/mmcblkN changes between boots, and the
# eMMC has partitions with the same names (see fw_env.config).
# bootname must match rauc.slot= set by boot.scr.
[slot.rootfs.0]
device=/dev/disk/by-path/platform-42080000.bus-amba-48220000.mmc-part10
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-path/platform-42080000.bus-amba-48220000.mmc-part11
type=ext4
bootname=B
