# Boot with the A/B logic from stm32mp2.env instead of ST's distro boot
CONFIG_BOOTCOMMAND="run rauc_boot"
# Import only variables marked writeable (BOOT_ORDER, BOOT_A_LEFT,
# BOOT_B_LEFT) from the environment partition
CONFIG_ENV_WRITEABLE_LIST=y
# ... and don't let "env set -f" bypass the access flags
CONFIG_ENV_ACCESS_IGNORE_FORCE=y
