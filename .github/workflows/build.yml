# Full image build on my own PC (self-hosted runner, label "yocto").
# Only pushes to main and manual starts run it, never pull requests: on a
# public repo a pull request from a fork could otherwise run its code on my PC.
# The runner runs as its own Linux user without access to my signing keys.
# The image is not signed; the RAUC bundle is signed with a CI test key that
# only the runner user can read and that my board does not trust
# (see docs/20-ci.md).
# A tag "v<DISTRO_VERSION>" builds a release: release configuration (no
# debug.yml), the SDK and its test, and a draft GitHub release made by a
# second job on GitHub's runner. Only that job may write to the repository.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the older build of the same branch or tag
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.repository == 'dattran96/yocto-stm32mp2-ota'
    runs-on: [self-hosted, linux, yocto]
    timeout-minutes: 360
    env:
      # BitBake runs in kas's container (rootless podman), so every build
      # uses the same host tools, like the parse job in ci.yml
      KAS_CONTAINER_ENGINE: podman
      DL_DIR: /srv/yocto/downloads
      SSTATE_DIR: ${{ github.workspace }}/../sstate
      DEPLOY: work/build/tmp/deploy/images/stm32mp25-disco
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: meta-mylayer
      # The version lives in the distro config; the tag has to say the same
      - name: Tag matches DISTRO_VERSION
        if: env.RELEASE == 'true'
        run: |
          v=$(sed -n 's/^DISTRO_VERSION = "\(.*\)"/\1/p' meta-mylayer/conf/distro/mydistro.conf)
          test "$GITHUB_REF_NAME" = "v$v" || { echo "::error::tag $GITHUB_REF_NAME, but DISTRO_VERSION is $v"; exit 1; }
      # Development builds have debug.yml (root login on the console),
      # releases do not (SSH key only, see docs/18-release-hardening.md)
      - name: Build configuration
        run: |
          k=../meta-mylayer/kas
          if [ "$RELEASE" = true ]; then
            echo "KAS_FILES=$k/stm32mp25-disco.yml:$k/cve.yml:$k/ci.yml" >> "$GITHUB_ENV"
          else
            echo "KAS_FILES=$k/stm32mp25-disco.yml:$k/debug.yml:$k/cve.yml:$k/ci.yml" >> "$GITHUB_ENV"
          fi
      # Read-only mounts into the build container: the shared sstate cache
      # (see kas/ci.yml), the CI test key, and a git setting for the shared
      # downloads (see .github/ci-gitconfig)
      - name: Container mounts
        run: |
          echo "MOUNTS=-v /srv/yocto/sstate:/srv/yocto/sstate:ro -v $HOME/ci-keys:/ci-keys:ro -v $GITHUB_WORKSPACE/meta-mylayer/.github/ci-gitconfig:/etc/gitconfig:ro" >> "$GITHUB_ENV"
      - name: Build my-image and my-bundle
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          mkdir -p work
          cd work
          ~/kas-venv/bin/kas-container --runtime-args "$MOUNTS" build "$KAS_FILES"
      # The bundle must verify against the CI test CA, with the right
      # compatible string and version
      - name: Check the bundle (rauc info)
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          cd work
          ~/kas-venv/bin/kas-container --runtime-args "$MOUNTS" shell "$KAS_FILES" -c \
            "bitbake -q -c addto_recipe_sysroot rauc-native && oe-run-native rauc-native rauc info --keyring=/ci-keys/ca.cert.pem tmp/deploy/images/stm32mp25-disco/my-bundle-stm32mp25-disco.raucb 2>&1" \
            | tee rauc-info.txt
          grep -q "^Compatible:.*'stm32mp257f-dk-mydistro'" rauc-info.txt
          grep -q "Verified inline signature by 'O = yocto-stm32mp2-ota CI" rauc-info.txt
          { echo '```'; grep -E "Verified|^Compatible|^Version|^Bundle Format" rauc-info.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Image file list and sizes
        run: ls -lL $DEPLOY/my-image-stm32mp25-disco.*.ext4 | tee -a "$GITHUB_STEP_SUMMARY"
      # Everything STM32CubeProgrammer needs to flash an empty board:
      # the flash layouts (.tsv) and the files they point to
      - name: Pack the flash image
        run: |
          tar -chf flash-image.tar -C $DEPLOY \
            flashlayout_my-image arm-trusted-firmware fip \
            my-bootfs-stm32mp25-disco.ext4 \
            my-image-stm32mp25-disco.splitted-rootfs.ext4.verity \
            my-image-stm32mp25-disco.splitted-userfs.ext4
      - uses: actions/upload-artifact@v4
        with:
          name: flash-image
          path: flash-image.tar
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: my-bundle-ci-signed
          path: ${{ env.DEPLOY }}/my-bundle-stm32mp25-disco.raucb
          retention-days: 7
      # SBOM (SPDX 2.2, written by Yocto's create-spdx) and a table of it
      - name: SBOM summary
        run: |
          scripts=meta-mylayer/scripts
          $scripts/sbom-summary.py $DEPLOY/my-image-stm32mp25-disco.rootfs.spdx.tar.zst > sbom.csv
          { echo "### Licenses in the image (recipes)"; echo '```'
            $scripts/sbom-summary.py --licenses $DEPLOY/my-image-stm32mp25-disco.rootfs.spdx.tar.zst
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.csv
            ${{ env.DEPLOY }}/my-image-stm32mp25-disco.rootfs.spdx.tar.zst
          retention-days: 14
      # Known security holes (NVD) per recipe in the image; the report
      # does not fail the build, the numbers go to the run summary
      - name: CVE summary
        run: |
          { echo "### CVE check"; echo '```'
            meta-mylayer/scripts/cve-summary.py $DEPLOY/my-image-stm32mp25-disco.rootfs.json
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cve-report
          path: ${{ env.DEPLOY }}/my-image-stm32mp25-disco.rootfs.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: my-image-manifest
          path: ${{ env.DEPLOY }}/my-image-stm32mp25-disco.rootfs.manifest
          retention-days: 14

      # After the reports are uploaded, so they can be read when a gate fails.
      # Fail on a forbidden license (GPLv3 family, see .github/license-allow.txt)
      # or a critical CVE that is not in .github/cve-baseline.txt (docs/21-*.md, 21d)
      - name: CI gates (licenses, critical CVEs)
        run: |
          rc=0
          meta-mylayer/scripts/ci-gates.py licenses \
            work/build/tmp/deploy/licenses/stm32mp25_disco/my-image-stm32mp25-disco.rootfs/license.manifest \
            --allow meta-mylayer/.github/license-allow.txt > gates.txt || rc=1
          meta-mylayer/scripts/ci-gates.py cves $DEPLOY/my-image-stm32mp25-disco.rootfs.json \
            --baseline meta-mylayer/.github/cve-baseline.txt >> gates.txt || rc=1
          cat gates.txt
          { echo "### CI gates"; echo '```'; cat gates.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Releases only: the SDK for application developers
      - name: Build the SDK
        if: env.RELEASE == 'true'
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          cd work
          ~/kas-venv/bin/kas-container --runtime-args "$MOUNTS" shell "$KAS_FILES" -c \
            "bitbake my-image -c populate_sdk"
          ls -l build/tmp/deploy/sdk/*.sh | tee -a "$GITHUB_STEP_SUMMARY"
      # Install the SDK in a fresh folder and cross-compile sdk-example with it,
      # the way an application developer would (docs/07-sdk.md)
      - name: Test the SDK
        if: env.RELEASE == 'true'
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          cd work
          ~/kas-venv/bin/kas-container --runtime-args "$MOUNTS" shell "$KAS_FILES" -c '
            set -e
            sh tmp/deploy/sdk/*.sh -y -d /tmp/sdk > /dev/null
            . /tmp/sdk/environment-setup-*
            $CC $CFLAGS $LDFLAGS /repo/sdk-example/zversion.c -o /tmp/zversion -lz
            file /tmp/zversion' | tee sdk-test.txt
          grep -q "ARM aarch64" sdk-test.txt
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: sdk
          path: |
            work/build/tmp/deploy/sdk/*.sh
            work/build/tmp/deploy/sdk/*.target.manifest
          retention-days: 7
      - name: Release notes
        if: env.RELEASE == 'true'
        run: |
          {
            echo "Version $GITHUB_REF_NAME, commit $GITHUB_SHA."
            echo
            echo "- Release configuration: no root login on the console, SSH key only."
            echo "- Not for devices as it is: TF-A, FIP and FIT are not signed in CI, and the"
            echo "  RAUC bundle is signed with the CI test key. See docs/20-ci.md (20f)."
            echo "- flash-image.tar: everything STM32CubeProgrammer needs for an empty board."
            echo "- The SDK installer, tested by cross-compiling sdk-example/."
            echo
            echo "### CVE check"; echo '```'
            meta-mylayer/scripts/cve-summary.py --top 5 $DEPLOY/my-image-stm32mp25-disco.rootfs.json
            echo '```'
          } > release-notes.md
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  # Releases only: collect the results and make a draft release. Runs on
  # GitHub's runner, so the token that can write to the repository never
  # reaches my PC. The draft is published by hand after checking it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md \
            $(ls dist/* | grep -v release-notes.md)
