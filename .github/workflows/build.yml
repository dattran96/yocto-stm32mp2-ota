# Full image build on my own PC (self-hosted runner, label "yocto").
# Only pushes to main and manual starts run it, never pull requests: on a
# public repo a pull request from a fork could otherwise run its code on my PC.
# The runner runs as its own Linux user without access to my signing keys.
# The image is not signed; the RAUC bundle is signed with a CI test key that
# only the runner user can read and that my board does not trust
# (see docs/20-ci.md).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One build at a time; a newer push cancels the older build
concurrency:
  group: build
  cancel-in-progress: true

jobs:
  image:
    if: github.repository == 'dattran96/yocto-stm32mp2-ota'
    runs-on: [self-hosted, linux, yocto]
    timeout-minutes: 360
    env:
      # BitBake runs in kas's container (rootless podman), so every build
      # uses the same host tools, like the parse job in ci.yml
      KAS_CONTAINER_ENGINE: podman
      DL_DIR: /srv/yocto/downloads
      SSTATE_DIR: ${{ github.workspace }}/../sstate
      DEPLOY: work/build/tmp/deploy/images/stm32mp25-disco
      KAS_FILES: ../meta-mylayer/kas/stm32mp25-disco.yml:../meta-mylayer/kas/debug.yml:../meta-mylayer/kas/ci.yml
    steps:
      - uses: actions/checkout@v4
        with:
          path: meta-mylayer
      # Read-only mounts into the build container: the shared sstate cache
      # (see kas/ci.yml), the CI test key, and a git setting for the shared
      # downloads (see .github/ci-gitconfig)
      - name: Container mounts
        run: |
          echo "MOUNTS=-v /srv/yocto/sstate:/srv/yocto/sstate:ro -v $HOME/ci-keys:/ci-keys:ro -v $GITHUB_WORKSPACE/meta-mylayer/.github/ci-gitconfig:/etc/gitconfig:ro" >> "$GITHUB_ENV"
      - name: Build my-image and my-bundle
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          mkdir -p work
          cd work
          ~/kas-venv/bin/kas-container --runtime-args "$MOUNTS" build "$KAS_FILES"
      # The bundle must verify against the CI test CA, with the right
      # compatible string and version
      - name: Check the bundle (rauc info)
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          cd work
          ~/kas-venv/bin/kas-container --runtime-args "$MOUNTS" shell "$KAS_FILES" -c \
            "bitbake -q -c addto_recipe_sysroot rauc-native && oe-run-native rauc-native rauc info --keyring=/ci-keys/ca.cert.pem tmp/deploy/images/stm32mp25-disco/my-bundle-stm32mp25-disco.raucb 2>&1" \
            | tee rauc-info.txt
          grep -q "^Compatible:.*'stm32mp257f-dk-mydistro'" rauc-info.txt
          grep -q "Verified inline signature by 'O = yocto-stm32mp2-ota CI" rauc-info.txt
          { echo '```'; grep -E "Verified|^Compatible|^Version|^Bundle Format" rauc-info.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Image file list and sizes
        run: ls -lL $DEPLOY/my-image-stm32mp25-disco.*.ext4 | tee -a "$GITHUB_STEP_SUMMARY"
      # Everything STM32CubeProgrammer needs to flash an empty board:
      # the flash layouts (.tsv) and the files they point to
      - name: Pack the flash image
        run: |
          tar -chf flash-image.tar -C $DEPLOY \
            flashlayout_my-image arm-trusted-firmware fip \
            my-bootfs-stm32mp25-disco.ext4 \
            my-image-stm32mp25-disco.splitted-rootfs.ext4.verity \
            my-image-stm32mp25-disco.splitted-userfs.ext4
      - uses: actions/upload-artifact@v4
        with:
          name: flash-image
          path: flash-image.tar
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: my-bundle-ci-signed
          path: ${{ env.DEPLOY }}/my-bundle-stm32mp25-disco.raucb
          retention-days: 7
      # SBOM (SPDX 2.2, written by Yocto's create-spdx) and a table of it
      - name: SBOM summary
        run: |
          scripts=meta-mylayer/scripts
          $scripts/sbom-summary.py $DEPLOY/my-image-stm32mp25-disco.rootfs.spdx.tar.zst > sbom.csv
          { echo "### Licenses in the image (recipes)"; echo '```'
            $scripts/sbom-summary.py --licenses $DEPLOY/my-image-stm32mp25-disco.rootfs.spdx.tar.zst
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.csv
            ${{ env.DEPLOY }}/my-image-stm32mp25-disco.rootfs.spdx.tar.zst
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: my-image-manifest
          path: ${{ env.DEPLOY }}/my-image-stm32mp25-disco.rootfs.manifest
          retention-days: 14
